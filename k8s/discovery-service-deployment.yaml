apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: discovery-service
  labels:
    app: discovery-service
spec:
  serviceName: discovery-service-headless
  replicas: 3
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      serviceAccountName: discovery-service
      containers:
      - name: discovery-service
        image: eda-discovery-service:v4
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATA_REDIS_HOST
          value: "redis-master"
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        # Readiness checks Redis reachability (/ready); liveness only checks that the
        # process serves HTTP (/health). A pod that has lost Redis cannot read the
        # registry, so it must drop out of readiness without being restarted.
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          failureThreshold: 3
---
# Headless service required by StatefulSet for stable pod DNS (discovery-service-0.discovery-service-headless, etc.)
apiVersion: v1
kind: Service
metadata:
  name: discovery-service-headless
  labels:
    app: discovery-service
spec:
  selector:
    app: discovery-service
  clusterIP: None
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
# ClusterIP service for external access (unchanged)
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  labels:
    app: discovery-service
spec:
  selector:
    app: discovery-service
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP
