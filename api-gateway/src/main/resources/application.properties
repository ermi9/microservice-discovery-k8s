spring.application.name=eda-api-gateway
server.port=8080

# Kafka consumer
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=api-gateway-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Deserialization happens inside poll(), where the container's error handler cannot see
# it, so an unparseable record would otherwise stall this consumer on the same offset
# forever. ErrorHandlingDeserializer turns it into a normal failed record, which the
# DefaultErrorHandler routes to service-events.DLT.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# The event SCHEMA is deserialized into this module's own local DTO. Ignoring type
# headers keeps that true even if a producer starts sending __TypeId__: the header would
# otherwise outrank default.type and demand com.eda.discovery.model.ServiceEvent, which
# is not on this classpath.
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.eda.gateway.model.ServiceEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.eda.gateway.model

# Producer exists only to publish irrecoverable records to the dead-letter topic.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
