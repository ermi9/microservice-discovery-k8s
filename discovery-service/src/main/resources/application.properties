spring.application.name=eda-discovery-service
server.port=8080

# Redis Configuration
spring.data.redis.host=redis-master
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Health Check Configuration
health-check.interval-ms=15000
health-check.max-retries=2
health-check.failure-threshold=3
health-check.timeout-ms=5000

# Leader Election Configuration — tighter TTL for faster per-partition failover
leader-election.ttl-seconds=10
leader-election.renewal-interval-ms=3000

# Partition Configuration
partition.count=3

# Kafka topic provisioning — service-events is created with 3 partitions (keyed by service
# name, so per-service event ordering is preserved while services spread across partitions).
kafka.topic.partitions=3
kafka.topic.replicas=1
logging.level.org.springframework.data.redis=DEBUG
logging.level.org.springframework.boot.autoconfigure=DEBUG

# Kafka
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
