spring.application.name=eda-discovery-service
server.port=8080

# Redis Configuration
spring.data.redis.host=redis-master
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Health Check Configuration
health-check.interval-ms=15000
health-check.max-retries=2
health-check.failure-threshold=3
health-check.timeout-ms=5000

# Leader Election Configuration — tighter TTL for faster per-partition failover
leader-election.ttl-seconds=10
leader-election.renewal-interval-ms=3000

# Partition Configuration
partition.count=3

# Keep autoconfigure at its default: DEBUG prints the full condition-evaluation report
# on every start, which buries the registry's own output in the pod logs.
logging.level.com.eda.discovery=INFO
logging.level.org.springframework.data.redis=WARN
logging.level.org.springframework.kafka=WARN

# Kafka
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# The event stream is a SCHEMA contract, not a Java-class contract. Without this,
# JsonSerializer stamps __TypeId__=com.eda.discovery.model.ServiceEvent onto every
# record, JsonDeserializer gives that header precedence over spring.json.value.default.type,
# and any consumer outside this module fails with "Class not found" — permanently
# stalling at the offset. Consumers own their own local DTO; see docs/ARCHITECTURE.md.
spring.kafka.producer.properties.spring.json.add.type.headers=false

# service-events topic (declared explicitly by KafkaTopicConfig, not auto-created)
service-events.topic.name=service-events
service-events.topic.partitions=3

# Kafka destination naming convention advertised to choreography consumers
topics.input.suffix=.in
topics.compensation.suffix=.compensate
