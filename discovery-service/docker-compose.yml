# Full local stack, matching the deployed architecture.
#
# The registry is Redis-only — there is no datasource and no file-backed registry. The
# topology below (one master, one replica) is what RedisConfig expects: writes and
# pub/sub to the master, reads preferring the replica.
services:
  redis-master:
    image: redis:7-alpine
    networks:
      - discovery-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica:
    image: redis:7-alpine
    command: ["redis-server", "--replicaof", "redis-master", "6379"]
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - discovery-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    networks:
      - discovery-network
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  discovery-service:
    image: eda-discovery-service:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=redis-master
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_REPLICA_HOST=redis-replica
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Single node locally: one partition leader, no peer relay to coordinate with.
      - PARTITION_COUNT=1
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      # /ready, not /health — readiness means Redis is actually reachable.
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - discovery-network

  api-gateway:
    image: eda-api-gateway:latest
    ports:
      - "8083:8080"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - discovery-network

  service-b:
    image: eda-inventory-service:latest
    ports:
      - "8081:8080"
    environment:
      - APP_NAME=service-b
      - APP_SERVICE_URL=http://service-b:8080
      - DISCOVERY_SERVICE_URL=http://discovery-service:8080
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - discovery-network

  service-a:
    image: eda-order-service:latest
    ports:
      - "8082:8080"
    environment:
      - APP_NAME=service-a
      - APP_SERVICE_URL=http://service-a:8080
      - GATEWAY_URL=http://api-gateway:8080
      - DISCOVERY_SERVICE_URL=http://discovery-service:8080
    depends_on:
      discovery-service:
        condition: service_healthy
      api-gateway:
        condition: service_started
    networks:
      - discovery-network

  service-c:
    image: service-c:latest
    ports:
      - "8084:8080"
    environment:
      - APP_NAME=service-c
      - APP_SERVICE_URL=http://service-c:8080
      - DISCOVERY_SERVICE_URL=http://discovery-service:8080
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - discovery-network

  service-d:
    image: service-d:latest
    ports:
      - "8085:8080"
    environment:
      - APP_NAME=service-d
      - APP_SERVICE_URL=http://service-d:8080
      - DISCOVERY_SERVICE_URL=http://discovery-service:8080
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - discovery-network

networks:
  discovery-network:
    driver: bridge
